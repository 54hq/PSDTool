<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="./css/style.css" type="text/css" rel="stylesheet">
</head>

<body>
  <div class="app">
    <h3>PSD工具</h3>
    <main class="main">
      <div class="in">
        <button id="openSpecificationButton">说明文档</button>
        <div class="row">
          <title>输出检查</title>
        </div>
        <div class="row">
          <label>文字规范</label><button id="checkFontButton">检查</button>
          <label>异常图层</label><button id="checkExportLayer">检查</button>
        </div>
        <div class="row">
          <label>命名规范</label><button id="standardizeButton">检查</button>
          <label>同名不同尺寸</label><button id="checkSameNameImageButton">检查</button>
        </div>
        <div class="row">
          <label>删除空白图层</label><button id="deleteEmptyLayerButton">开始</button>
          <label>智能滤镜</label><button id="checkSmartObjectFilterFXButton">检查</button>
        </div>
        <div class="row">
          <label>重复编号</label><button id="checkSameLayerIdButton">检查</button>
          <label>检查字体效果</label><button id="checkTextEffectButton">检查</button>
        </div>
        <div class="row">
          <title>同步编号</title>
        </div>
        <div class="row">
          <label>图层编号</label><button id="renameButton">编号</button>
        </div>
        <div class="row">
          <title>表格结构</title>
        </div>
        <div class="row">
          <label>列表类型</label>
          <select id="listType" class="normal-select">
            <option value="1">固定列表</option>
            <option value="2">滚动列表</option>
          </select>
        </div>
        <div class="row">
          <label>布局方向</label>
          <select id="layoutType" class="normal-select">
            <option value="1">从左往右</option>
            <option value="2">从上往下</option>
          </select>
        </div>
        <div class="row">
          <label>最大列数：</label><input type="number" value="1" id="maxColumn"> 列
        </div>
        <div class="row">
          <label>最大行数：</label><input type="number" value="1" id="maxRow"> 行
        </div>
        <div class="row">
          <label>水平间距：</label><input type="number" value="0" id="gapHorizontal"> 像素
        </div>
        <div class="row">
          <label>垂直间距：</label><input type="number" value="0" id="gapVertical"> 像素
        </div>
        <div class="row">
          <label>上间距：</label><input type="number" value="0" id="paddingTop"> 像素
        </div>
        <div class="row">
          <label>左间距：</label><input type="number" value="0" id="paddingLeft"> 像素
        </div>
        <div class="row">
          <label> </label><button id="createLayoutListButton">创建结构</button>
        </div>
        <div class="row">
          <label> </label><button id="createPreviewLayoutButton">生成预览</button>
        </div>
        <div class="row">
          <label> </label><button id="removePreviewLayoutButton">移除预览</button>
        </div>
        <div class="row">
          <label> </label><button id="createMaskButton">生成遮罩</button>
        </div>
        <div class="row">
          <label> </label><button id="previewFormatButton">预览格式化位置</button>
        </div>
        <div class="row">
          <title>占位图</title>
        </div>
        <div class="row">
          <label>宽:</label><input type="number" value="40" id="iconSizeWidth"> 像素
        </div>
        <div class="row">
          <label>高:</label><input type="number" value="40" id="iconSizeHeight"> 像素
        </div>
        <div class="row">
          <label> </label><button id="createIconSizeButton">生成</button>
        </div>
        <div class="row">
          <title>图层操作</title>
        </div>
        <div class="row">
          <label> </label><button id="clearLockButton">清除图层锁定</button>
        </div>
        <div class="row">
          <label> </label><button id="ignoreSelectLayerButton">忽略所有选中图层</button>
        </div>
        <div class="row">
          <label> </label><button id="genSpecifiedImageButton">生成GridItem图层</button>
        </div>
        <div class="row">
          <label> </label><button id="printSelectLayerSizeButton">打印当前选中图层的数据尺寸(单个)</button>
        </div>
        <div class="row">
          <label> </label><button id="showAllLayerButton">展示所有图层</button>
        </div>
        <div class="row">
          <label> </label><button id="getLayerCountButton">当前PSD图层总数</button>
        </div>
        <div class="row">
          <label>线性伽马修正</label><input type="number" value="0.454545" id="gammaCorrectionNumber"><button id="gammaCorrectionButton">修正</button>
        </div>
        <div class="row">
          <title>PSD操作</title>
        </div>
        <div class="row">
          <label> </label><button id="createTempPurePSDButton">生成无忽略PSD文件</button>
        </div>
        <div class="row">
          <title>其他功能</title>
        </div>
        <div class="row">
          <label> </label><button id="hideIgnoreLayerButton">隐藏忽略图层</button>
        </div>
        <div class="row">
          <label> </label><button id="comparePsdButton">对比PSD编号</button>
        </div>
        <div class="row">
          <label>组效果异常</label><button id="checkGroupEffectButton">检查</button>
          <label>混合模式修正</label><button id="amendModeButton">开始</button>
        </div>
        <div class="row">
          <label>删除图层提示</label>
          <label class="checkbox-toggle md">
              <input type="checkbox" id="deleteNoticeToggle">
              <span class="slider"></span>
          </label>
        </div>
      </div>
    </main>
  </div>
  <script type="text/javascript" src="./js/CSInterface-6.1.0.js"></script>
  <script type="text/javascript" src="./js/main.js"></script>
</body>

</html>
