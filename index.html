<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="./css/style.css" type="text/css" rel="stylesheet">
</head>

<body>
  <div class="app">
    <div class="header">
      <h3>PSD 工具箱</h3>
      <button id="openSpecificationButton" class="text-btn">说明文档</button>
    </div>

    <main class="main-content">
      <div class="control-panel">
        <div class="section" style="margin-bottom: 10px;">
          <button id="checkAllAndOpenButton" style="width: 100%; background: #0078d4; border-color: #0078d4; font-weight: bold;">一键执行所有检查</button>
        </div>

        <div class="section">
          <div class="section-title">规范检查</div>
          <div class="button-grid">
            <button id="checkSameNameContentButton">检查同名资源(同名尺寸不同)</button>
            <button id="checkOutOfBoundsButton">检查超框图片</button>
          </div>
        </div>

        <div class="section">
          <div class="section-title">辅助工具</div>
          <div class="button-grid">
            <button id="selectImgPrefixButton">选资源图层</button>
            <button id="selectEffectModeButton">选含效果图层</button>
            <button id="openAllLayersButton">打开所有图层</button>
          </div>
        </div>
      </div>

      <div class="results-panel">
        <div class="results-header">
          <span>检查结果</span>
          <button id="clearResultsButton" class="small-btn">清空</button>
        </div>
        <div id="resultList" class="result-list">
          <div class="empty-state">请点击上方按钮进行检查</div>
        </div>
      </div>
    </main>
  </div>
  <script type="text/javascript" src="./js/CSInterface-6.1.0.js"></script>
  <script type="text/javascript" src="./js/main.js"></script>
</body>

</html>
