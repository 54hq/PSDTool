<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="./css/style.css" type="text/css" rel="stylesheet">
</head>

<body>
  <div class="app">
    <h3>PSD工具</h3>
    <main class="main">
      <div class="in">
        <button id="openSpecificationButton">说明文档</button>
        <div class="row">
          <title>输出检查</title>
        </div>
        <div class="row">
          <label>文字规范</label><button id="checkFontButton">检查</button>
          <label>异常图层</label><button id="checkExportLayer">检查</button>
        </div>
        <div class="row">
          <label>命名规范</label><button id="standardizeButton">检查</button>
          <label>同名不同尺寸</label><button id="checkSameNameImageButton">检查</button>
        </div>
        <div class="row">
          <label>删除空白图层</label><button id="deleteEmptyLayerButton">开始</button>
          <label>智能滤镜</label><button id="checkSmartObjectFilterFXButton">检查</button>
        </div>
        <div class="row">
          <label>同名内容检查</label><button id="checkSameNameContentButton">检查</button>
          <label>超框图片</label><button id="checkOutOfBoundsButton">检查</button>
        </div>
        <div class="row">
          <label>Img/9Img图层</label><button id="selectImgPrefixButton">选中</button>
          <label>效果/模式图层</label><button id="selectEffectModeButton">选中</button>
        </div>
        <div class="row">
          <label>打开所有图层</label><button id="openAllLayersButton">开始</button>
        </div>
      </div>
    </main>
  </div>
  <script type="text/javascript" src="./js/CSInterface-6.1.0.js"></script>
  <script type="text/javascript" src="./js/main.js"></script>
</body>

</html>
